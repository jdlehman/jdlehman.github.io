name: Deploy hub to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [app_updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hub
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install hub deps
        run: npm ci

      - name: Build hub
        run: npm run build

      # --- Private app integration ---
      # Each app is a private repo that builds to static HTML. We check it out
      # with a PAT, build it, and copy its output into the hub's dist/<slug>.
      # Apps can use any stack (Vite, Astro, Next static, plain) — just ensure
      # the build output dir matches the config. If a repo/secret is missing,
      # we keep the hub's fallback page for that slug.
      # For unlisted (UUID) apps, the slug is stored in a GitHub Secret (e.g.
      # RECIPE_VIEWER_SLUG) and the dist path is that UUID — see APPS.md §5.
      # Each unlisted app MUST have its *_SLUG secret or the build fails.

      - name: Checkout water_drop_bench (private)
        uses: actions/checkout@v4
        with:
          repository: jdlehman/water_drop_bench
          token: ${{ secrets.APPS_PAT }}
          path: apps/water_drop_bench
          # uncomment if you use a non-default branch:
          # ref: main
        continue-on-error: true

      - name: Build water_drop_bench
        working-directory: apps/water_drop_bench
        run: |
          if [ -f package.json ]; then
            npm ci
            APP_SHA=$(git rev-parse HEAD) npm run build
          fi
          # If the app is plain HTML (no build), just copy the repo root
          if [ ! -d dist ] && [ -f index.html ]; then
            mkdir -p dist
            cp -r index.html dist/ 2>/dev/null || true
          fi

      - name: Merge water_drop_bench into hub dist
        run: |
          if [ -d apps/water_drop_bench/dist ]; then
            mkdir -p dist/water_drop_bench
            # Copy built app; ensure it has an index.html at the slug root
            cp -r apps/water_drop_bench/dist/* dist/water_drop_bench/
            echo "Merged water_drop_bench -> dist/water_drop_bench"
            ls -R dist/water_drop_bench | head -n 50
          else
            echo "No water_drop_bench build found — keeping hub fallback"
          fi

      - name: Checkout water_for_coffee_crafter (private)
        uses: actions/checkout@v4
        with:
          repository: jdlehman/water_for_coffee_crafter
          token: ${{ secrets.APPS_PAT }}
          path: apps/water_for_coffee_crafter
        continue-on-error: true

      - name: Build water_for_coffee_crafter
        working-directory: apps/water_for_coffee_crafter
        run: |
          if [ -f package.json ]; then
            npm ci
            APP_SHA=$(git rev-parse HEAD) npm run build
          fi
          if [ ! -d dist ] && [ -f index.html ]; then
            mkdir -p dist
            cp -r index.html dist/ 2>/dev/null || true
          fi

      - name: Merge water_for_coffee_crafter into hub dist
        run: |
          if [ -d apps/water_for_coffee_crafter/dist ]; then
            mkdir -p dist/water_for_coffee_crafter
            cp -r apps/water_for_coffee_crafter/dist/* dist/water_for_coffee_crafter/
            echo "Merged water_for_coffee_crafter -> dist/water_for_coffee_crafter"
            ls -R dist/water_for_coffee_crafter | head -n 50
          else
            echo "No water_for_coffee_crafter build found — keeping hub fallback"
          fi

      - name: Checkout meticulous_profile_builder (private)
        uses: actions/checkout@v4
        with:
          repository: jdlehman/meticulous_profile_builder
          token: ${{ secrets.APPS_PAT }}
          path: apps/meticulous_profile_builder
        continue-on-error: true

      - name: Build meticulous_profile_builder
        working-directory: apps/meticulous_profile_builder
        run: |
          if [ -f package.json ]; then
            npm ci
            APP_SHA=$(git rev-parse HEAD) npm run build
          fi
          if [ ! -d dist ] && [ -f index.html ]; then
            mkdir -p dist
            cp -r index.html dist/ 2>/dev/null || true
          fi

      - name: Merge meticulous_profile_builder into hub dist
        run: |
          if [ -d apps/meticulous_profile_builder/dist ]; then
            mkdir -p dist/meticulous_profile_builder
            cp -r apps/meticulous_profile_builder/dist/* dist/meticulous_profile_builder/
            echo "Merged meticulous_profile_builder -> dist/meticulous_profile_builder"
            ls -R dist/meticulous_profile_builder | head -n 50
          else
            echo "No meticulous_profile_builder build found — keeping hub fallback"
          fi

      - name: Checkout midi_studio (private)
        uses: actions/checkout@v4
        with:
          repository: jdlehman/midi_studio
          token: ${{ secrets.APPS_PAT }}
          path: apps/midi_studio
        continue-on-error: true

      - name: Build midi_studio
        working-directory: apps/midi_studio
        run: |
          if [ -f package.json ]; then
            npm ci
            APP_SHA=$(git rev-parse HEAD) npm run build
          fi
          if [ ! -d dist ] && [ -f index.html ]; then
            mkdir -p dist
            cp -r index.html dist/ 2>/dev/null || true
          fi

      - name: Merge midi_studio into hub dist
        run: |
          if [ -d apps/midi_studio/dist ]; then
            mkdir -p dist/midi_studio
            cp -r apps/midi_studio/dist/* dist/midi_studio/
            echo "Merged midi_studio -> dist/midi_studio"
            ls -R dist/midi_studio | head -n 50
          else
            echo "No midi_studio build found — keeping hub fallback"
          fi

      # Songwriter: unlisted at /songwriter/ (not on the landing page, noindex, no analytics).
      # It lives in the midi_studio repo (apps/songwriter, an npm workspace), so it reuses that
      # checkout and its npm ci from the steps above.
      - name: Build songwriter (from midi_studio)
        working-directory: apps/midi_studio
        run: |
          if [ -f apps/songwriter/package.json ]; then
            APP_SHA=$(git rev-parse HEAD) npm run build -w apps/songwriter
          fi

      - name: Merge songwriter into hub dist (unlisted at /songwriter/)
        run: |
          if [ -d apps/midi_studio/apps/songwriter/dist ]; then
            mkdir -p dist/songwriter
            cp -r apps/midi_studio/apps/songwriter/dist/* dist/songwriter/
            touch dist/songwriter/.unlisted   # marker: no analytics, noindex; removed before upload
            echo "Merged songwriter -> /songwriter/ (unlisted)"
          else
            echo "No songwriter build found — /songwriter/ will 404 until midi_studio main has it"
          fi

      # Sectional: unlisted at /sectional/ (not on the landing page, noindex, no analytics).
      # Also in the midi_studio repo (apps/sectional), reusing that checkout and its npm ci.
      - name: Build sectional (from midi_studio)
        working-directory: apps/midi_studio
        run: |
          if [ -f apps/sectional/package.json ]; then
            APP_SHA=$(git rev-parse HEAD) npm run build -w apps/sectional
          fi

      - name: Merge sectional into hub dist (unlisted at /sectional/)
        run: |
          if [ -d apps/midi_studio/apps/sectional/dist ]; then
            mkdir -p dist/sectional
            cp -r apps/midi_studio/apps/sectional/dist/* dist/sectional/
            touch dist/sectional/.unlisted   # marker: no analytics, noindex; removed before upload
            echo "Merged sectional -> /sectional/ (unlisted)"
          else
            echo "No sectional build found — /sectional/ will 404 until midi_studio main has it"
          fi

      # --- Unlisted (private) apps — UUID slugs via secrets, not discoverable via robots/sitemap ---
      - name: Validate unlisted app slug secrets (fail if missing)
        env:
          RECIPE_VIEWER_SLUG: ${{ secrets.RECIPE_VIEWER_SLUG }}
        run: |
          echo "Validating unlisted slug secrets..."
          if [ -z "$RECIPE_VIEWER_SLUG" ]; then
            echo "ERROR: RECIPE_VIEWER_SLUG secret is not set"
            echo "Generate a UUID: node -e \"console.log(crypto.randomUUID())\""
            echo "Then add to hub repo → Settings → Secrets → Actions → RECIPE_VIEWER_SLUG"
            echo "Also set the same UUID as base: '/<uuid>/' in jdlehman/recipe_viewer vite.config.ts"
            exit 1
          fi
          # Validate UUID format without printing the value (uses env indirection so secret never appears in workflow file interpolation)
          if ! echo "$RECIPE_VIEWER_SLUG" | grep -Eq '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'; then
            echo "ERROR: RECIPE_VIEWER_SLUG is not a valid UUID"
            exit 1
          fi
          echo "RECIPE_VIEWER_SLUG is set and valid (value hidden)"
          # Add more secrets here as you add unlisted apps:
          # env: OTHER_APP_SLUG: ${{ secrets.OTHER_APP_SLUG }}
          # if [ -z "$OTHER_APP_SLUG" ]; then echo "ERROR: OTHER_APP_SLUG not set"; exit 1; fi

      - name: Checkout recipe_viewer (private, unlisted UUID)
        uses: actions/checkout@v4
        with:
          repository: jdlehman/recipe_viewer
          token: ${{ secrets.APPS_PAT }}
          path: apps/recipe_viewer
        continue-on-error: true

      - name: Build recipe_viewer
        working-directory: apps/recipe_viewer
        run: |
          if [ -f package.json ]; then
            npm ci
            APP_SHA=$(git rev-parse HEAD) npm run build
          fi
          if [ ! -d dist ] && [ -f index.html ]; then
            mkdir -p dist
            cp -r index.html dist/ 2>/dev/null || true
          fi

      - name: Merge recipe_viewer into hub dist (unlisted at /recipes/)
        run: |
          if [ -d apps/recipe_viewer/dist ]; then
            mkdir -p dist/recipes
            cp -r apps/recipe_viewer/dist/* dist/recipes/
            touch dist/recipes/.unlisted   # marker: no analytics, noindex; removed before upload
            echo "Merged recipe_viewer -> /recipes/ (unlisted)"
          else
            echo "No recipe_viewer build found — /recipes/ will 404 until private build exists"
          fi

      - name: Redirect recipe_viewer's old secret URL to /recipes/
        env:
          RECIPE_VIEWER_SLUG: ${{ secrets.RECIPE_VIEWER_SLUG }}
        run: |
          # The app used to live at /<uuid>/. Keep that address working: send visitors (with any
          # #pair= link intact) to /recipes/, and retire the old service worker so installed
          # copies stop serving the cached app from the old path.
          UUID="$RECIPE_VIEWER_SLUG"
          if ! echo "$UUID" | grep -Eq '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'; then
            echo "ERROR: RECIPE_VIEWER_SLUG missing or invalid"; exit 1
          fi
          mkdir -p "dist/$UUID"
          cat > "dist/$UUID/index.html" << 'HTML'
          <!doctype html>
          <html><head><meta charset="utf-8"><meta name="robots" content="noindex, nofollow, noarchive">
          <title>Recipes</title>
          <script>location.replace('/recipes/' + location.search + location.hash)</script>
          </head><body><a href="/recipes/">Recipes have moved</a></body></html>
          HTML
          cat > "dist/$UUID/sw.js" << 'JS'
          self.addEventListener('install', () => self.skipWaiting())
          self.addEventListener('activate', (e) => e.waitUntil((async () => {
            await self.registration.unregister()
            for (const c of await self.clients.matchAll({ type: 'window' })) c.navigate('/recipes/' + new URL(c.url).hash)
          })()))
          JS
          sed -i 's/^          //' "dist/$UUID/index.html" "dist/$UUID/sw.js"
          touch "dist/$UUID/.unlisted"
          echo "Old recipe_viewer URL now redirects to /recipes/ (UUID hidden)"

      # --- Add more public apps by duplicating the 3 steps above ---
      # For unlisted UUID apps, duplicate the recipe_viewer block:
      # 1. Add validation for NEW_APP_SLUG in the Validate step
      # 2. Checkout jdlehman/new-app -> apps/new-app
      # 3. Build it
      # 4. Merge: UUID="${{ secrets.NEW_APP_SLUG }}" -> dist/$UUID

      - name: Inject GA4 into sub-apps (dynamic — no per-app manual edit needed)
        run: |
          GA_ID="G-SC00ZQFH59"
          # Allow override via secret for rotation without code change
          if [ -n "${{ secrets.GA_MEASUREMENT_ID }}" ]; then
            GA_ID="${{ secrets.GA_MEASUREMENT_ID }}"
          fi
          echo "Using GA_ID=$GA_ID"
          # Auto-discover all sub-app index.html files (public + unlisted) — no hardcoded slug list
          for INDEX in dist/*/index.html; do
            [ -f "$INDEX" ] || continue
            # Hidden apps (marked .unlisted) get no analytics: their URLs can carry private data.
            if [ -f "$(dirname "$INDEX")/.unlisted" ]; then
              echo "skip unlisted app — no analytics"
              continue
            fi
            if grep -q "googletagmanager.com/gtag" "$INDEX"; then
              echo "skip $INDEX — already has gtag"
              continue
            fi
            if ! grep -q "</head>" "$INDEX"; then
              echo "warn $INDEX — no </head> found, skipping injection"
              continue
            fi
            echo "Injecting GA4 $GA_ID into $INDEX"
            # Use python for safer injection (handles multi-line, preserves encoding)
            python3 - "$INDEX" "$GA_ID" << 'PY'
          import sys
          path, ga_id = sys.argv[1], sys.argv[2]
          snippet = f'<!-- Google tag (gtag.js) — GA4 auto-injected by hub deploy -->\n<script async src="https://www.googletagmanager.com/gtag/js?id={ga_id}"></script>\n<script>window.dataLayer=window.dataLayer||[];function gtag(){{dataLayer.push(arguments);}}gtag(\'js\',new Date());gtag(\'config\',\'{ga_id}\');</script>\n'
          with open(path, 'r', encoding='utf-8') as f:
              html = f.read()
          html = html.replace('</head>', snippet + '</head>', 1)
          with open(path, 'w', encoding='utf-8') as f:
              f.write(html)
          print(f"injected {ga_id} into {path}")
          PY
          done
          echo "GA injection complete — verify:"
          grep -l "G-SC00ZQFH59\|googletagmanager" dist/index.html dist/*/index.html 2>/dev/null || echo "no gtag found (hub fallback may not have sub-apps in this build)"

      - name: Inject noindex into unlisted apps (not discoverable via search/robots.txt)
        run: |
          echo "Injecting noindex into unlisted apps (any dist/* not in public config)..."
          python3 << 'PY'
          import re, pathlib
          config_path = pathlib.Path("src/apps.config.ts")
          text = config_path.read_text(encoding="utf-8")
          # Build public set by parsing config and excluding visibility: unlisted
          # Shared logic with vite.config.ts sitemapPlugin and Generate sitemap step — keep in sync
          public_slugs = set()
          for m in re.finditer(r"slug:\s*['\"]([^'\"]+)['\"]", text):
              slug = m.group(1)
              snippet = text[m.start():m.start()+1200]
              next_slug_pos = text.find("slug:", m.end())
              unlisted_pos = snippet.find("unlisted")
              is_unlisted = False
              if unlisted_pos != -1:
                  abs_unlisted = m.start() + unlisted_pos
                  if next_slug_pos == -1 or abs_unlisted < next_slug_pos:
                      vis_idx = snippet.find("visibility")
                      if vis_idx != -1 and abs(vis_idx - unlisted_pos) < 300:
                          is_unlisted = True
              if not is_unlisted:
                  public_slugs.add(slug)
          print(f"Public slugs: {sorted(public_slugs)}")
          dist = pathlib.Path("dist")
          count = 0
          for child in dist.iterdir():
              if not child.is_dir():
                  continue
              if child.name in ("assets",):
                  continue
              index = child / "index.html"
              if not index.is_file():
                  continue
              if child.name in public_slugs:
                  print(f"skip public {child.name}")
                  continue
              # Unlisted / secret slug — inject noindex (don't log the UUID itself)
              html = index.read_text(encoding="utf-8")
              if 'name="robots"' in html:
                  print(f"skip unlisted app — already has robots meta")
                  continue
              if "</head>" not in html:
                  print(f"warn unlisted app — no </head> found, skipping")
                  continue
              snippet = '<meta name="robots" content="noindex, nofollow, noarchive">\n'
              html = html.replace("</head>", snippet + "</head>", 1)
              index.write_text(html, encoding="utf-8")
              print(f"injected noindex into unlisted app")
              count += 1
          print(f"noindex injected into {count} unlisted app(s)")
          PY
          echo "noindex injection complete — verify:"
          grep -l 'name="robots"' dist/*/index.html 2>/dev/null | sed 's|dist/.*|dist/[unlisted]/index.html|' | head
          echo "(above paths masked for unlisted)"

      - name: Generate sitemap.xml (exclude unlisted)
        run: |
          echo "Generating sitemap.xml excluding unlisted apps..."
          python3 << 'PY'
          import re, datetime, pathlib
          config_path = pathlib.Path("src/apps.config.ts")
          text = config_path.read_text(encoding="utf-8")
          # Parse public slugs only (exclude visibility: unlisted)
          slugs = []
          for m in re.finditer(r"slug:\s*['\"]([^'\"]+)['\"]", text):
              slug = m.group(1)
              snippet = text[m.start():m.start()+1200]
              next_slug_pos = text.find("slug:", m.end())
              unlisted_pos = snippet.find("unlisted")
              is_unlisted = False
              if unlisted_pos != -1:
                  abs_unlisted = m.start() + unlisted_pos
                  if next_slug_pos == -1 or abs_unlisted < next_slug_pos:
                      vis_idx = snippet.find("visibility")
                      if vis_idx != -1 and abs(vis_idx - unlisted_pos) < 300:
                          is_unlisted = True
              if not is_unlisted:
                  slugs.append(slug)
          # Deduplicate preserving order
          seen = set()
          public_slugs = []
          for s in slugs:
              if s not in seen:
                  seen.add(s)
                  public_slugs.append(s)
          print(f"Public slugs for sitemap: {public_slugs}")
          site = "https://inlehmansterms.net"
          today = datetime.date.today().isoformat()
          lines = ['<?xml version="1.0" encoding="UTF-8"?>', '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">']
          lines.append(f'  <url><loc>{site}/</loc><lastmod>{today}</lastmod></url>')
          for slug in public_slugs:
              lines.append(f'  <url><loc>{site}/{slug}/</loc><lastmod>{today}</lastmod></url>')
          lines.append('</urlset>')
          content = "\n".join(lines) + "\n"
          pathlib.Path("dist/sitemap.xml").write_text(content, encoding="utf-8")
          print(content)
          # Verify no unlisted slug leaked — check that every URL in sitemap is a public slug
          # (secret slugs are not in public_slugs, so they won't be in content by construction)
          print("sitemap.xml generated successfully, no unlisted slugs present")
          PY
          echo "--- dist/sitemap.xml ---"
          cat dist/sitemap.xml
          echo "--- dist/robots.txt ---"
          cat dist/robots.txt
          echo "Checking robots.txt does not accidentally contain UUID pattern as Disallow..."
          # robots.txt should be generic Allow, not per-slug Disallow
          if grep -Eq 'Disallow:.*[0-9a-f]{8}-' dist/robots.txt 2>/dev/null; then
            echo "ERROR: robots.txt appears to contain a UUID Disallow"
            exit 1
          fi
          echo "robots.txt clean — unlisted not discoverable"

      - name: Remove unlisted markers
        run: find dist -maxdepth 2 -name .unlisted -delete

      - name: Ensure CNAME
        run: cp public/CNAME dist/CNAME 2>/dev/null || echo "inlehmansterms.net" > dist/CNAME

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
